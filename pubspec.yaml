name: sell_sorter
description: Sorts photos of things to sell into one folder per item. Family photos are skipped.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^0.10.0
  google_mlkit_image_labeling: ^0.10.0
  image: ^4.0.0
  image_picker: ^1.0.0
  path_provider: ^2.0.0
  photo_manager: ^3.0.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
